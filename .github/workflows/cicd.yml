name: Push to ACR

on:
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy to"
                required: true
                type: choice
                options:
                    - DEV
                    - UAT
                    - PROD
                default: DEV

permissions:
    id-token: write
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'DEV' }}
        steps:
            - uses: actions/checkout@v7

            - name: Azure login (OIDC)
              uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: ACR login
              run: az acr login --name ${{ vars.ACR_NAME }}

            - name: Build and push
              run: |
                  docker build -t ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }} .
                  docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
